<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Computer Corporation History</title>
<style>
  body { font-family: sans-serif; margin: 0; padding: 1em; }
  h1 { font-size: 2.6em; margin: 0 0 0.3em; }
  p.hint { color: #666; font-size: 1.1em; }
  p.version { color: #999; font-size: 0.85em; margin-top: 0.3em; }
  #app { position: relative; width: 100%; height: 85vh; overflow: hidden; border: 1px solid #ccc; }
  #legend {
    position: absolute; left: 10px; bottom: 10px; z-index: 10;
    background: rgba(255,255,255,0.92); border: 1px solid #ccc; border-radius: 4px;
    padding: 8px 10px; font-size: 12px; line-height: 1.6; pointer-events: none;
  }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-swatch {
    display: inline-block; width: 22px; height: 0; border-top-width: 3px; border-top-color: #000;
  }
  #chart { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  #chart.dragging { cursor: grabbing; }
  .year-label { font-size: 11px; fill: #555; }
  .year-header-bg { fill: white; stroke: #ddd; stroke-width: 1; }
  .grid-line { stroke: #ddd; stroke-width: 1; }
  .corp-line { stroke: #333; stroke-width: 2; cursor: pointer; }
  .corp-label { font-size: 11px; fill: #111; cursor: pointer; user-select: none; }
  .event-label { font-size: 10px; display: none; }
  #chart.zoomed-in .event-label { display: inline; }
  .rename-tick { stroke-width: 2; }
  .corp.dim, .event.dim { opacity: 0.12; }
  .corp.focus .corp-line { stroke-width: 3; }
  .event.focus .event-line { stroke-width: 3; }
</style>
</head>
<body>
<h1>Computer Corporation History</h1>
<p class="hint">企業の線またはラベルをクリックすると関連するイベントだけハイライトされます(背景クリックで解除)。ホイールでズーム、ドラッグまたはWASDキーで移動できます。</p>
<p class="version" id="version"></p>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
<script src="app.js"></script>
</body>
</html>
